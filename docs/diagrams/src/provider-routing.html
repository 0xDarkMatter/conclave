<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="provider-routing-title provider-routing-desc">
  <title id="provider-routing-title">How a provider token is routed</title>
  <desc id="provider-routing-desc">Flowchart: a provider token with a vendor/model slug goes to OpenRouter in API mode or is rejected in CLI mode; a plain name goes to the direct API in -g mode or to the wrapped CLI otherwise, and the gemini CLI falls back to the API on an auth failure.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Arrows first -->
  <!-- start -> D1 -->
  <line x1="500" y1="68" x2="500" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- D1 yes (right) -> D2 -->
  <line x1="596" y1="140" x2="664" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- D1 no (down) -> D3 -->
  <line x1="500" y1="180" x2="500" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- D2 yes (down) -> OpenRouter (accent: the new path) -->
  <line x1="760" y1="180" x2="760" y2="268" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <!-- D2 no (right) -> error -->
  <line x1="856" y1="140" x2="888" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- D3 yes (right then down) -> Direct API top -->
  <path d="M 596,280 H 632 Q 640,280 640,288 V 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- D3 no (left then down) -> CLI wrapper top -->
  <path d="M 404,280 H 368 Q 360,280 360,288 V 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- CLI wrapper -> Direct API: gemini auth fallback (dashed, secondary) -->
  <line x1="440" y1="432" x2="560" y2="432" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Arrow labels -->
  <rect x="612" y="120" width="36" height="12" rx="2" fill="#f5f5f5"/>
  <text x="630" y="129" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
  <rect x="512" y="200" width="28" height="12" rx="2" fill="#f5f5f5"/>
  <text x="526" y="209" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
  <rect x="772" y="212" width="36" height="12" rx="2" fill="#f5f5f5"/>
  <text x="790" y="221" fill="#eb6c36" font-size="8" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
  <rect x="860" y="120" width="28" height="12" rx="2" fill="#f5f5f5"/>
  <text x="874" y="129" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
  <rect x="652" y="332" width="36" height="12" rx="2" fill="#f5f5f5"/>
  <text x="670" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
  <rect x="312" y="332" width="28" height="12" rx="2" fill="#f5f5f5"/>
  <text x="326" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
  <rect x="452" y="408" width="96" height="12" rx="2" fill="#f5f5f5"/>
  <text x="500" y="417" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AUTH FALLBACK</text>

  <!-- Start (oval) -->
  <rect x="420" y="28" width="160" height="40" rx="20" fill="#f5f5f5"/>
  <rect x="420" y="28" width="160" height="40" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text x="500" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" text-anchor="middle">provider token</text>

  <!-- D1: has a vendor/ prefix? -->
  <polygon points="404,140 500,100 596,140 500,180" fill="#f5f5f5"/>
  <polygon points="404,140 500,100 596,140 500,180" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="500" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" text-anchor="middle">contains a slash?</text>
  <text x="500" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle">vendor/model</text>

  <!-- D2: -g set? -->
  <polygon points="664,140 760,100 856,140 760,180" fill="#f5f5f5"/>
  <polygon points="664,140 760,100 856,140 760,180" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="760" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" text-anchor="middle">API mode?</text>
  <text x="760" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle">-g / -c</text>

  <!-- End: error (oval) -->
  <rect x="888" y="120" width="96" height="40" rx="20" fill="#f5f5f5"/>
  <rect x="888" y="120" width="96" height="40" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text x="936" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" text-anchor="middle">error: add -g</text>

  <!-- D3: -g set? -->
  <polygon points="404,280 500,240 596,280 500,320" fill="#f5f5f5"/>
  <polygon points="404,280 500,240 596,280 500,320" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="500" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" text-anchor="middle">API mode?</text>
  <text x="500" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle">-g / -c</text>

  <!-- OpenRouter (focal) -->
  <rect x="680" y="268" width="160" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="680" y="268" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <rect x="688" y="276" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
  <text x="702" y="285" fill="#eb6c36" font-size="7" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
  <text x="760" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" text-anchor="middle">OpenRouter</text>
  <text x="760" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle">any slug · pay-as-you-go</text>

  <!-- CLI wrapper -->
  <rect x="280" y="400" width="160" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="280" y="400" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="288" y="408" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="302" y="417" fill="#2d3142" font-size="7" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
  <text x="360" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" text-anchor="middle">Wrapped CLI</text>
  <text x="360" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle">subscription · glm over http</text>

  <!-- Direct API -->
  <rect x="560" y="400" width="160" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="560" y="400" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="568" y="408" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="582" y="417" fill="#2d3142" font-size="7" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
  <text x="640" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" text-anchor="middle">Direct API</text>
  <text x="640" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle">vendor key · priced</text>

  <!-- Legend strip -->
  <line x1="40" y1="500" x2="960" y2="500" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
  <rect x="40" y="532" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="64" y="542" fill="#4f5d75" font-size="8" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif">New in 1.3.0: slash routing (ADR-010)</text>
  <rect x="280" y="532" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="304" y="542" fill="#4f5d75" font-size="8" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif">Transport</text>
  <rect x="400" y="532" width="16" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text x="424" y="542" fill="#4f5d75" font-size="8" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif">Start / end</text>
  <line x1="540" y1="538" x2="572" y2="538" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="580" y="542" fill="#4f5d75" font-size="8" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif">Fallback: gemini CLI auth failure with a key present</text>
</svg>
