<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="provider-routing-dark-title provider-routing-dark-desc">
  <title id="provider-routing-dark-title">How a provider token is routed</title>
  <desc id="provider-routing-dark-desc">Flowchart: a provider token with a vendor/model slug goes to OpenRouter when the API transport applies (-g, -c or @api) and is otherwise rejected; a plain name first checks for a pinned transport (an @cli or @api suffix, then the config file), sending @api to the direct API and @cli to the wrapped CLI, and only an unpinned name falls through to the global mode: direct API in -g mode, wrapped CLI otherwise. The gemini CLI falls back to the API on an auth failure.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#2d3142"/>

  <!-- Arrows first -->
  <!-- start -> D1 -->
  <line x1="500" y1="60" x2="500" y2="90" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- D1 yes (right) -> D2 -->
  <line x1="596" y1="130" x2="664" y2="130" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- D1 no (down) -> D3 (transport pinned?) -->
  <line x1="500" y1="170" x2="500" y2="200" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- D2 yes (down) -> OpenRouter -->
  <line x1="760" y1="170" x2="760" y2="240" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- D2 no (right) -> error -->
  <line x1="856" y1="130" x2="880" y2="130" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- D3 @api (right then down) -> Direct API top (accent: the new path) -->
  <path d="M 596,240 H 672 Q 680,240 680,248 V 440" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <!-- D3 @cli (left then down) -> CLI wrapper top (accent: the new path) -->
  <path d="M 404,240 H 328 Q 320,240 320,248 V 440" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <!-- D3 no (down) -> D4 (global mode) -->
  <line x1="500" y1="280" x2="500" y2="310" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- D4 yes (right then down) -> Direct API top -->
  <path d="M 596,350 H 602 Q 610,350 610,358 V 440" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- D4 no (left then down) -> CLI wrapper top -->
  <path d="M 404,350 H 398 Q 390,350 390,358 V 440" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- CLI wrapper -> Direct API: gemini auth fallback (dashed, secondary) -->
  <line x1="440" y1="472" x2="560" y2="472" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Arrow labels -->
  <rect x="612" y="110" width="36" height="12" rx="2" fill="#2d3142"/>
  <text x="630" y="119" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
  <rect x="512" y="178" width="28" height="12" rx="2" fill="#2d3142"/>
  <text x="526" y="187" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
  <rect x="772" y="198" width="36" height="12" rx="2" fill="#2d3142"/>
  <text x="790" y="207" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
  <rect x="856" y="110" width="28" height="12" rx="2" fill="#2d3142"/>
  <text x="870" y="119" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
  <rect x="612" y="222" width="40" height="12" rx="2" fill="#2d3142"/>
  <text x="632" y="231" fill="#f08a59" font-size="8" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">@API</text>
  <rect x="348" y="222" width="40" height="12" rx="2" fill="#2d3142"/>
  <text x="368" y="231" fill="#f08a59" font-size="8" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">@CLI</text>
  <rect x="512" y="288" width="28" height="12" rx="2" fill="#2d3142"/>
  <text x="526" y="297" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
  <rect x="616" y="380" width="36" height="12" rx="2" fill="#2d3142"/>
  <text x="634" y="389" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
  <rect x="352" y="380" width="28" height="12" rx="2" fill="#2d3142"/>
  <text x="366" y="389" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
  <rect x="452" y="448" width="96" height="12" rx="2" fill="#2d3142"/>
  <text x="500" y="457" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AUTH FALLBACK</text>

  <!-- Start (oval) -->
  <rect x="420" y="20" width="160" height="40" rx="20" fill="#2d3142"/>
  <rect x="420" y="20" width="160" height="40" rx="20" fill="rgba(191,192,192,0.10)" stroke="#8e98ac" stroke-width="1"/>
  <text x="500" y="44" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" text-anchor="middle">provider token</text>

  <!-- D1: contains a slash? -->
  <polygon points="404,130 500,90 596,130 500,170" fill="#2d3142"/>
  <polygon points="404,130 500,90 596,130 500,170" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
  <text x="500" y="126" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" text-anchor="middle">contains a slash?</text>
  <text x="500" y="142" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle">vendor/model</text>

  <!-- D2: API transport applies? (slugs have no CLI) -->
  <polygon points="664,130 760,90 856,130 760,170" fill="#2d3142"/>
  <polygon points="664,130 760,90 856,130 760,170" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
  <text x="760" y="126" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" text-anchor="middle">API transport?</text>
  <text x="760" y="142" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle">-g / -c / @api</text>

  <!-- End: error (oval) -->
  <rect x="880" y="110" width="112" height="40" rx="20" fill="#2d3142"/>
  <rect x="880" y="110" width="112" height="40" rx="20" fill="rgba(191,192,192,0.10)" stroke="#8e98ac" stroke-width="1"/>
  <text x="936" y="127" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" text-anchor="middle">error</text>
  <text x="936" y="141" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle">add -g or use @api</text>

  <!-- D3: transport pinned? (focal: new in ADR-012) -->
  <polygon points="404,240 500,200 596,240 500,280" fill="#2d3142"/>
  <polygon points="404,240 500,200 596,240 500,280" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
  <text x="500" y="236" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" text-anchor="middle">transport pinned?</text>
  <text x="500" y="252" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle">@suffix, then config</text>

  <!-- D4: global mode -->
  <polygon points="404,350 500,310 596,350 500,390" fill="#2d3142"/>
  <polygon points="404,350 500,310 596,350 500,390" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
  <text x="500" y="346" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" text-anchor="middle">API mode?</text>
  <text x="500" y="362" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle">-g / -c</text>

  <!-- OpenRouter -->
  <rect x="680" y="240" width="160" height="64" rx="6" fill="#2d3142"/>
  <rect x="680" y="240" width="160" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
  <rect x="688" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
  <text x="702" y="257" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
  <text x="760" y="276" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" text-anchor="middle">OpenRouter</text>
  <text x="760" y="292" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle">any slug · pay-as-you-go</text>

  <!-- CLI wrapper -->
  <rect x="280" y="440" width="160" height="64" rx="6" fill="#2d3142"/>
  <rect x="280" y="440" width="160" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
  <rect x="288" y="448" width="28" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
  <text x="302" y="457" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
  <text x="360" y="476" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" text-anchor="middle">Wrapped CLI</text>
  <text x="360" y="492" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle">subscription · unpriced</text>

  <!-- Direct API -->
  <rect x="560" y="440" width="160" height="64" rx="6" fill="#2d3142"/>
  <rect x="560" y="440" width="160" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
  <rect x="568" y="448" width="28" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
  <text x="582" y="457" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
  <text x="640" y="476" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" text-anchor="middle">Direct API</text>
  <text x="640" y="492" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle">vendor key · priced</text>

  <!-- Legend strip -->
  <line x1="40" y1="540" x2="960" y2="540" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
  <text x="40" y="556" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
  <rect x="40" y="572" width="16" height="12" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
  <text x="64" y="582" fill="#bfc0c0" font-size="8" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif">New: per-provider transport, @cli / @api or config (ADR-012)</text>
  <rect x="380" y="572" width="16" height="12" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
  <text x="404" y="582" fill="#bfc0c0" font-size="8" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif">Transport</text>
  <rect x="480" y="572" width="16" height="12" rx="2" fill="rgba(191,192,192,0.10)" stroke="#8e98ac" stroke-width="1"/>
  <text x="504" y="582" fill="#bfc0c0" font-size="8" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif">Start / end</text>
  <line x1="600" y1="578" x2="632" y2="578" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="640" y="582" fill="#bfc0c0" font-size="8" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif">Fallback: gemini CLI auth failure with a key present</text>
</svg>
