<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="how-it-works-dark-title how-it-works-dark-desc">
  <title id="how-it-works-dark-title">How Conclave works</title>
  <desc id="how-it-works-dark-desc">Architecture diagram: a prompt with context goes to the orchestrator, which fans out in parallel to Gemini, OpenAI and Claude; their responses go to a judge that synthesizes one verdict for output.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#2d3142"/>

  <!-- Zone: providers (drawn first) -->
  <rect x="392" y="16" width="208" height="336" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
  <rect x="456" y="20" width="80" height="12" rx="2" fill="#2d3142"/>
  <text x="496" y="29" fill="rgba(245,245,245,0.40)" font-size="7" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">PROVIDERS</text>

  <!-- Arrows (behind nodes) -->
  <!-- Input -> Orchestrator -->
  <line x1="168" y1="208" x2="216" y2="208" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Orchestrator -> providers: fanned attach points on the right edge (y 192 / 208 / 224) -->
  <path d="M 360,192 H 380 Q 388,192 388,184 V 88 Q 388,80 396,80 H 416" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="360" y1="208" x2="416" y2="208" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 360,224 H 380 Q 388,224 388,232 V 328 Q 388,336 396,336 H 416" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Providers -> Judge: fanned attach points on the judge's left edge -->
  <path d="M 576,80 H 596 Q 604,80 604,88 V 184 Q 604,192 612,192 H 632" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="576" y1="208" x2="632" y2="208" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 576,336 H 596 Q 604,336 604,328 V 232 Q 604,224 612,224 H 632" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Judge -> Verdict (primary flow) -->
  <line x1="776" y1="208" x2="824" y2="208" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

  <!-- Arrow labels (masked, 6-10px clear of the stroke) -->
  <rect x="352" y="120" width="72" height="12" rx="2" fill="#2d3142"/>
  <text x="388" y="129" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PARALLEL</text>
  <rect x="568" y="120" width="72" height="12" rx="2" fill="#2d3142"/>
  <text x="604" y="129" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RESPONSES</text>
  <rect x="780" y="184" width="40" height="12" rx="2" fill="#2d3142"/>
  <text x="800" y="193" fill="#f08a59" font-size="8" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">VERDICT</text>

  <!-- Node: Prompt (input) -->
  <rect x="40" y="176" width="128" height="64" rx="6" fill="#2d3142"/>
  <rect x="40" y="176" width="128" height="64" rx="6" fill="rgba(191,192,192,0.10)" stroke="#8e98ac" stroke-width="1"/>
  <rect x="48" y="184" width="24" height="12" rx="2" fill="transparent" stroke="rgba(142,152,172,0.40)" stroke-width="0.8"/>
  <text x="60" y="193" fill="#8e98ac" font-size="7" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
  <text x="104" y="212" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" text-anchor="middle">Prompt</text>
  <text x="104" y="228" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle">-f files · stdin</text>

  <!-- Node: Orchestrator (backend) -->
  <rect x="216" y="176" width="144" height="64" rx="6" fill="#2d3142"/>
  <rect x="216" y="176" width="144" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
  <rect x="224" y="184" width="32" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
  <text x="240" y="193" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
  <text x="288" y="212" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" text-anchor="middle">Orchestrator</text>
  <text x="288" y="228" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle">per-provider timeout</text>

  <!-- Node: Gemini (external) -->
  <rect x="416" y="48" width="160" height="64" rx="6" fill="#2d3142"/>
  <rect x="416" y="48" width="160" height="64" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
  <rect x="424" y="56" width="32" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.22)" stroke-width="0.8"/>
  <text x="440" y="65" fill="#8e98ac" font-size="7" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
  <text x="496" y="84" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" text-anchor="middle">Gemini</text>
  <text x="496" y="100" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle">gemini CLI · API</text>

  <!-- Node: OpenAI (external) -->
  <rect x="416" y="176" width="160" height="64" rx="6" fill="#2d3142"/>
  <rect x="416" y="176" width="160" height="64" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
  <rect x="424" y="184" width="32" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.22)" stroke-width="0.8"/>
  <text x="440" y="193" fill="#8e98ac" font-size="7" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
  <text x="496" y="212" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" text-anchor="middle">OpenAI</text>
  <text x="496" y="228" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle">codex CLI · API</text>

  <!-- Node: Claude (external) -->
  <rect x="416" y="304" width="160" height="64" rx="6" fill="#2d3142"/>
  <rect x="416" y="304" width="160" height="64" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
  <rect x="424" y="312" width="32" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.22)" stroke-width="0.8"/>
  <text x="440" y="321" fill="#8e98ac" font-size="7" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
  <text x="496" y="340" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" text-anchor="middle">Claude</text>
  <text x="496" y="356" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle">claude CLI · API</text>

  <!-- Node: Judge (focal) -->
  <rect x="632" y="176" width="144" height="64" rx="6" fill="#2d3142"/>
  <rect x="632" y="176" width="144" height="64" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
  <rect x="640" y="184" width="36" height="12" rx="2" fill="transparent" stroke="rgba(240,138,89,0.50)" stroke-width="0.8"/>
  <text x="658" y="193" fill="#f08a59" font-size="7" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">JUDGE</text>
  <text x="704" y="212" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" text-anchor="middle">Judge</text>
  <text x="704" y="228" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle">--judge claude · --blind</text>

  <!-- Node: Verdict (store) -->
  <rect x="824" y="176" width="136" height="64" rx="6" fill="#2d3142"/>
  <rect x="824" y="176" width="136" height="64" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
  <rect x="832" y="184" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.50)" stroke-width="0.8"/>
  <text x="846" y="193" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
  <text x="892" y="212" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" text-anchor="middle">Verdict</text>
  <text x="892" y="228" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" text-anchor="middle">json · brief · raw</text>

  <!-- Legend strip -->
  <line x1="40" y1="380" x2="960" y2="380" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
  <text x="40" y="396" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
  <rect x="40" y="412" width="16" height="12" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
  <text x="64" y="422" fill="#bfc0c0" font-size="8" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif">Judge, skipped for a single provider</text>
  <rect x="280" y="412" width="16" height="12" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
  <text x="304" y="422" fill="#bfc0c0" font-size="8" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif">Conclave</text>
  <rect x="400" y="412" width="16" height="12" rx="2" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
  <text x="424" y="422" fill="#bfc0c0" font-size="8" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif">Provider (any of six, or vendor/model via OpenRouter)</text>
  <line x1="760" y1="418" x2="792" y2="418" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <text x="800" y="422" fill="#bfc0c0" font-size="8" font-family="'Geist', 'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif">Primary flow</text>
</svg>
