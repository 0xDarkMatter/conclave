name: check

# CI runs `make check` verbatim. Re-listing the steps here is exactly how the
# two drift: an earlier version of this file grew a race pass the Makefile
# lacked, and marked the catalog check continue-on-error, so real model drift
# could never fail a PR. There is one gate, and this runs it.
#
# Depends on GNU make existing on both runner images, which it does. If that
# ever changes the job fails loudly rather than quietly checking less.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        # bash on both, so the Makefile's shell fragments behave identically.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # vet, gofmt, go test, go test -race, then build + models --check.
      #
      # The gate adapts per platform rather than being weakened here: the race
      # pass skips on Windows, where a cgo toolchain is usually absent, and
      # `conclave models --check` skips only when it exits 3 (catalog
      # unreachable). Exit 2 is real drift against the live catalog and fails
      # the job, which is what continue-on-error used to prevent.
      - name: make check
        run: make check
